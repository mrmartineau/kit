name: NPM Release

on:
  workflow_dispatch:
    inputs:
      skip-safe-chain:
        description: Skip the Aikido safe-chain malware check on install
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Node provides the `npm` binary that @semantic-release/npm shells out to.
      - uses: actions/setup-node@v6
        with:
          # semantic-release needs an LTS Node (^22.14 or >=24.10); `latest` can be a pre-release.
          node-version: 'lts/*'
      - name: Install safe-chain
        if: ${{ !inputs.skip-safe-chain }}
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci
      - run: bun install --frozen-lockfile
      - run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
